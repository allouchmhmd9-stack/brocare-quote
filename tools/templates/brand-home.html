<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent quoter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- An insurer's demo home page. Made by tools/new_insurer.py from tools/templates/brand-home.html:
     everything on it comes from that insurer's settings file, brands/{{KEY}}.js. -->
<script src="../{{KEY}}.js"></script>
<script src="../../brand.js"></script>
<script>document.write('<style>'+BrocareBrand.themeCss(window.BROCARE_BRAND)+'</style>');</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../quoter-ui.css">
<link rel="stylesheet" href="../../home-ui.css">
</head>
<body>
<div class="brandbar">
  <span class="brandhome" id="mark"></span>
  <span class="spacer"></span>
  <span class="demo" id="demo">Demo</span>
</div>
<div class="home">
  <div>
    <h1 id="headline">Quote in seconds, on the tariff you trust.</h1>
    <div class="sub" id="who"></div>
  </div>

  <nav class="tiles" id="tiles"></nav>

  <section class="box" aria-labelledby="mq">
    <div class="bh"><h2 id="mq">My quotes</h2><span class="count" id="cnt">0</span></div>
    <input class="find" id="find" type="search" placeholder="Search by client name" aria-label="Search saved quotes" hidden>
    <div id="list"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  var B=window.BROCARE_BRAND, $=function(i){return document.getElementById(i);}, esc=BrocareBrand.esc;
  var root='../../', key=encodeURIComponent(B.key);
  document.title=B.name+' · Agent quoter';
  $('mark').innerHTML = B.logo
    ? '<img src="'+esc(/^(data:|https?:|\/)/.test(B.logo)?B.logo:root+B.logo)+'" alt="'+esc(B.name)+'">'
    : '<div class="brandword"><b>'+esc(B.name)+'</b>'+(B.tagline?'<i>'+esc(B.tagline)+'</i>':'')+'</div>';
  if(!B.demo) $('demo').hidden=true;
  if(B.headline) $('headline').textContent=B.headline;
  $('who').textContent='Welcome'+(B.agent&&B.agent.name?', '+B.agent.name:'')+'. Pick what you are quoting.';
  $('foot').innerHTML=esc(B.footer||'')+'<br>Powered by <b>Brocare AI</b>';

  /* one tile per line the insurer sells */
  var TILES={
    motor:['<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-5h9L18 17M7.5 12l1.6-3.6A2 2 0 0 1 10.9 7h2.2a2 2 0 0 1 1.8 1.4L16.5 12"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/></svg>','Motor quote','Scan the registration card or type the car. Price by value and year, with the eligibility checks built in.'],
    health:['<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.3-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.7-7 10-7 10z"/></svg>','Health quote','Photograph the ID cards of a person or a whole family. Price by age and cover level.']
  };
  $('tiles').innerHTML=(B.products||['motor','health']).filter(function(p){return TILES[p];}).map(function(p){
    var t=TILES[p];
    return '<a class="tile" href="'+root+p+'/?brand='+key+'"><span class="ico" aria-hidden="true">'+t[0]+'</span>'+
      '<span class="tname">'+t[1]+'</span><span class="tdesc">'+t[2]+'</span></a>';
  }).join('');

  var openRem=null;
  function when(iso){ var d=new Date(iso); return d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'})+' '+d.getFullYear(); }
  function paint(){
    var all=BrocareBrand.quotes(), term=$('find').value.trim().toLowerCase();
    var list=all.filter(function(q){ return !term || (q.client||'').toLowerCase().indexOf(term)>=0; });
    $('cnt').textContent=all.length; $('find').hidden=all.length<4;
    if(!all.length){ $('list').innerHTML='<div class="empty">Nothing saved yet. Make a quote, press <b>Save</b>, and it appears here with a one-tap resend and a renewal reminder.</div>'; return; }
    if(!list.length){ $('list').innerHTML='<div class="empty">No saved quote for that name.</div>'; return; }
    $('list').innerHTML=list.map(function(q){
      return '<div class="q" data-id="'+esc(q.id)+'"><div class="qt"><span class="qc">'+esc(q.client||'No name')+'</span><span class="qp">'+esc(q.price)+'</span></div>'+
        '<div class="qm">'+esc(q.type)+' · '+esc(when(q.t))+'</div>'+
        '<div class="qa"><button class="go" data-a="send">Send again</button><button data-a="rem">Renewal reminder</button><button class="del" data-a="del">Delete</button></div>'+
        '<div class="rem'+(openRem===q.id?' on':'')+'"><label>Policy starts <input type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><button data-a="ics">Add to calendar</button><span>Reminds you 30 days before it renews.</span></div></div>';
    }).join('');
  }
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]'); if(!b) return;
    var row=b.closest('.q'), id=row.dataset.id, q=BrocareBrand.quotes().filter(function(x){return x.id===id;})[0]; if(!q) return;
    var a=b.dataset.a;
    if(a==='send') window.open(BrocareBrand.waUrl(BrocareBrand.message(B,q),q.phone),'_blank','noopener');
    else if(a==='del'){ if(confirm('Delete this saved quote?')){ BrocareBrand.remove(id); paint(); } }
    else if(a==='rem'){ openRem=openRem===id?null:id; paint(); }
    else if(a==='ics'){ var text=BrocareBrand.ics(q,row.querySelector('input[type=date]').value,30); if(text) BrocareBrand.download('renewal-'+(q.client||'client').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics',text); }
  });
  $('find').addEventListener('input',paint);
  paint();
})();
</script>
</body>
</html>
