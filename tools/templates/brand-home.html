<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent quoter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- An insurer's demo home page. Made by tools/new_insurer.py from tools/templates/brand-home.html:
     everything on it comes from that insurer's settings file, brands/{{KEY}}.js. -->
<script src="../{{KEY}}.js"></script>
<script src="../../brand.js"></script>
<script>document.write('<style>'+BrocareBrand.themeCss(window.BROCARE_BRAND)+'</style>');</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;padding:22px 16px calc(30px + env(safe-area-inset-bottom))}
  .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
  .top img{height:56px;width:auto;display:block}
  .demo{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--warn);
    border:1px solid var(--warn);border-radius:99px;padding:4px 10px;white-space:nowrap}
  h1{font-size:22px;line-height:1.25;margin:6px 0 0;letter-spacing:-.01em}
  .sub{color:var(--ink2);font-size:14px;margin-top:2px}
  .tiles{display:flex;flex-direction:column;gap:11px}
  a.tile{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:16px;transition:border-color .12s,transform .12s}
  a.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
  a.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ico{width:42px;height:42px;border-radius:11px;flex:none;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:21px}
  .tname{display:block;font-size:16.5px;font-weight:700;letter-spacing:-.01em}
  .tdesc{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
  .chev{margin-left:auto;color:var(--ink2);font-size:20px;font-weight:700;flex:none}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
  .bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .bh h2{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .count{font-size:12px;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:2px 9px}
  .find{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:600 14px inherit;font-family:inherit;margin-bottom:8px}
  .find:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .q{border-top:1px solid var(--line);padding:11px 0}
  .q:first-of-type{border-top:0}
  .qt{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .qc{font-weight:700}
  .qp{font-weight:800;color:var(--price);font-variant-numeric:tabular-nums;white-space:nowrap}
  .qm{font-size:12.5px;color:var(--ink2);margin-top:1px}
  .qa{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .qa button{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:9px;padding:8px 11px;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
  .qa button:hover{border-color:var(--accent)}
  .qa .go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .qa .del{color:var(--ink2)}
  .qa .del:hover{color:var(--warn);border-color:var(--warn)}
  .rem{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink2)}
  .rem.on{display:flex}
  .rem button{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 11px;font:700 12.5px inherit;font-family:inherit;cursor:pointer}
  .rem input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:8px;font:600 14px inherit;font-family:inherit}
  .empty{color:var(--ink2);font-size:13.5px;line-height:1.45}
  .foot{font-size:11.5px;color:var(--ink2);text-align:center;padding:2px 8px 0;line-height:1.5}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div id="mark"></div>
    <span class="demo" id="demo">Demo</span>
  </div>
  <div>
    <h1 id="headline">Quote in seconds, on the tariff you trust.</h1>
    <div class="sub" id="who"></div>
  </div>

  <nav class="tiles" id="tiles"></nav>

  <section class="box" aria-labelledby="mq">
    <div class="bh"><h2 id="mq">My quotes</h2><span class="count" id="cnt">0</span></div>
    <input class="find" id="find" type="search" placeholder="Search by client name" aria-label="Search saved quotes" hidden>
    <div id="list"></div>
  </section>

  <div class="foot" id="foot"></div>
</div>
<script>
(function(){
  var B=window.BROCARE_BRAND, $=function(i){return document.getElementById(i);}, esc=BrocareBrand.esc;
  var root='../../', key=encodeURIComponent(B.key);
  document.title=B.name+' · Agent quoter';
  $('mark').innerHTML = B.logo
    ? '<img src="'+esc(/^(data:|https?:|\/)/.test(B.logo)?B.logo:root+B.logo)+'" alt="'+esc(B.name)+'">'
    : '<div class="brandword"><b>'+esc(B.name)+'</b>'+(B.tagline?'<i>'+esc(B.tagline)+'</i>':'')+'</div>';
  if(!B.demo) $('demo').hidden=true;
  if(B.headline) $('headline').textContent=B.headline;
  $('who').textContent='Welcome'+(B.agent&&B.agent.name?', '+B.agent.name:'')+'. Pick what you are quoting.';
  $('foot').innerHTML=esc(B.footer||'')+'<br>Powered by <b>Brocare AI</b>';

  /* one tile per line the insurer sells */
  var TILES={
    motor:['🚗','Motor quote','Scan the registration card or type the car. Price by value and year, with the eligibility checks built in.'],
    health:['🏥','Health quote','Photograph the ID cards of a person or a whole family. Price by age and cover level.']
  };
  $('tiles').innerHTML=(B.products||['motor','health']).filter(function(p){return TILES[p];}).map(function(p){
    var t=TILES[p];
    return '<a class="tile" href="'+root+p+'/?brand='+key+'"><span class="ico" aria-hidden="true">'+t[0]+'</span>'+
      '<span><span class="tname">'+t[1]+'</span><span class="tdesc">'+t[2]+'</span></span><span class="chev" aria-hidden="true">›</span></a>';
  }).join('');

  var openRem=null;
  function when(iso){ var d=new Date(iso); return d.getDate()+' '+d.toLocaleString('en-GB',{month:'short'})+' '+d.getFullYear(); }
  function paint(){
    var all=BrocareBrand.quotes(), term=$('find').value.trim().toLowerCase();
    var list=all.filter(function(q){ return !term || (q.client||'').toLowerCase().indexOf(term)>=0; });
    $('cnt').textContent=all.length; $('find').hidden=all.length<4;
    if(!all.length){ $('list').innerHTML='<div class="empty">Nothing saved yet. Make a quote, press <b>Save quote</b>, and it appears here with a one-tap resend and a renewal reminder.</div>'; return; }
    if(!list.length){ $('list').innerHTML='<div class="empty">No saved quote for that name.</div>'; return; }
    $('list').innerHTML=list.map(function(q){
      return '<div class="q" data-id="'+esc(q.id)+'"><div class="qt"><span class="qc">'+esc(q.client||'No name')+'</span><span class="qp">'+esc(q.price)+'</span></div>'+
        '<div class="qm">'+esc(q.type)+' · '+esc(when(q.t))+'</div>'+
        '<div class="qa"><button class="go" data-a="send">Send again</button><button data-a="rem">Renewal reminder</button><button class="del" data-a="del">Delete</button></div>'+
        '<div class="rem'+(openRem===q.id?' on':'')+'"><label>Policy starts <input type="date" value="'+new Date().toISOString().slice(0,10)+'"></label><button data-a="ics">Add to calendar</button><span>Reminds you 30 days before it renews.</span></div></div>';
    }).join('');
  }
  $('list').addEventListener('click',function(e){
    var b=e.target.closest('button[data-a]'); if(!b) return;
    var row=b.closest('.q'), id=row.dataset.id, q=BrocareBrand.quotes().filter(function(x){return x.id===id;})[0]; if(!q) return;
    var a=b.dataset.a;
    if(a==='send') window.open(BrocareBrand.waUrl(BrocareBrand.message(B,q),q.phone),'_blank','noopener');
    else if(a==='del'){ if(confirm('Delete this saved quote?')){ BrocareBrand.remove(id); paint(); } }
    else if(a==='rem'){ openRem=openRem===id?null:id; paint(); }
    else if(a==='ics'){ var text=BrocareBrand.ics(q,row.querySelector('input[type=date]').value,30); if(text) BrocareBrand.download('renewal-'+(q.client||'client').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics',text); }
  });
  $('find').addEventListener('input',paint);
  paint();
})();
</script>
</body>
</html>
